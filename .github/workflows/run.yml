name: Run

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Every Sunday at 4:30 am UTC.
    - cron: '30 4 * * 0'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version: '26'
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install uv
      # setup-uv does not publish major version tags.
      uses: astral-sh/setup-uv@v10.3.3
      with:
        # Key the Python package cache on scripts' inline dependency metadata.
        cache-dependency-glob: '**/*.py'

    - name: Install knit
      run: |
        curl -fsSL https://github.com/jmou/knit/releases/download/latest/knit-ubuntu-latest.tar.gz | tar xzC "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/knit-ubuntu-latest" >> $GITHUB_PATH

    - name: knit
      run: |
        knit init
        knit run-plan
        knit unpack production @ --remove-prefix out/result/web/_site/ _site

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: _site/


  publish:
    if: github.event_name == 'push'
    needs: run
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: "pages"

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
