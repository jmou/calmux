name: Run

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Every Sunday at 4:30 am UTC.
    - cron: '30 4 * * 0'

jobs:
  make:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: '26'
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: make
      run: make -j4 -k

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: site
        path: web/_site/
